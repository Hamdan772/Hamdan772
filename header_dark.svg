<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="g1" cx="25%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2" cx="75%" cy="65%" r="55%">
    <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g3" cx="50%" cy="50%" r="40%">
    <stop offset="0%" stop-color="#c084fc" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="50%" stop-color="#818cf8"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>
  <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#fff" stop-opacity="0">
      <animate attributeName="offset" values="-0.5;1.5" dur="3.5s" repeatCount="indefinite"/>
    </stop>
    <stop offset="10%" stop-color="#fff" stop-opacity="0.25">
      <animate attributeName="offset" values="-0.4;1.6" dur="3.5s" repeatCount="indefinite"/>
    </stop>
    <stop offset="20%" stop-color="#fff" stop-opacity="0">
      <animate attributeName="offset" values="-0.3;1.7" dur="3.5s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <filter id="softglow">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- BG layers -->
<rect width="1920" height="600" fill="#0d1117" rx="16"/>
<rect width="1920" height="600" fill="url(#g1)" rx="16"/>
<rect width="1920" height="600" fill="url(#g2)" rx="16"/>
<rect width="1920" height="600" fill="url(#g3)" rx="16"/>

<!-- Grid -->
<g opacity="0.04">
  <line x1="96" y1="0" x2="96" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="192" y1="0" x2="192" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="288" y1="0" x2="288" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="384" y1="0" x2="384" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="480" y1="0" x2="480" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="576" y1="0" x2="576" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="672" y1="0" x2="672" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="768" y1="0" x2="768" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="864" y1="0" x2="864" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="960" y1="0" x2="960" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="1056" y1="0" x2="1056" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="1152" y1="0" x2="1152" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="1248" y1="0" x2="1248" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="1344" y1="0" x2="1344" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="1440" y1="0" x2="1440" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="1536" y1="0" x2="1536" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="1632" y1="0" x2="1632" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="1728" y1="0" x2="1728" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="1824" y1="0" x2="1824" y2="600" stroke="#fff" stroke-width=".5"/>
  <line x1="0" y1="96" x2="1920" y2="96" stroke="#fff" stroke-width=".5"/>
  <line x1="0" y1="192" x2="1920" y2="192" stroke="#fff" stroke-width=".5"/>
  <line x1="0" y1="288" x2="1920" y2="288" stroke="#fff" stroke-width=".5"/>
  <line x1="0" y1="384" x2="1920" y2="384" stroke="#fff" stroke-width=".5"/>
  <line x1="0" y1="480" x2="1920" y2="480" stroke="#fff" stroke-width=".5"/>
</g>

<!-- Floating orbs -->
<circle cx="180" cy="140" r="3" fill="#38bdf8" opacity="0" filter="url(#softglow)">
  <animate attributeName="cy" values="140;120;140" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <animate attributeName="opacity" values="0.15;0.5;0.15" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
</circle>
<circle cx="440" cy="470" r="2" fill="#818cf8" opacity="0" filter="url(#softglow)">
  <animate attributeName="cy" values="470;448;470" dur="8.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <animate attributeName="opacity" values="0.1;0.4;0.1" dur="8.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
</circle>
<circle cx="780" cy="100" r="1.5" fill="#c084fc" opacity="0" filter="url(#softglow)">
  <animate attributeName="cy" values="100;82;100" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <animate attributeName="opacity" values="0.08;0.35;0.08" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
</circle>
<circle cx="1150" cy="500" r="2.5" fill="#38bdf8" opacity="0" filter="url(#softglow)">
  <animate attributeName="cy" values="500;478;500" dur="7.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <animate attributeName="opacity" values="0.1;0.45;0.1" dur="7.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
</circle>
<circle cx="1450" cy="130" r="2" fill="#c084fc" opacity="0" filter="url(#softglow)">
  <animate attributeName="cy" values="130;112;130" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <animate attributeName="opacity" values="0.08;0.4;0.08" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
</circle>
<circle cx="1720" cy="380" r="1.8" fill="#818cf8" opacity="0" filter="url(#softglow)">
  <animate attributeName="cy" values="380;360;380" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <animate attributeName="opacity" values="0.1;0.4;0.1" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
</circle>
<circle cx="350" cy="300" r="1.2" fill="#38bdf8" opacity="0">
  <animate attributeName="cy" values="300;285;300" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <animate attributeName="opacity" values="0.06;0.28;0.06" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
</circle>
<circle cx="1600" cy="220" r="1" fill="#c084fc" opacity="0">
  <animate attributeName="cy" values="220;207;220" dur="6.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  <animate attributeName="opacity" values="0.06;0.24;0.06" dur="6.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
</circle>

<!-- Accent line + shimmer -->
<rect x="560" y="300" width="800" height="2.5" rx="1.25" fill="url(#accent)" opacity="0.35"/>
<rect x="560" y="300" width="800" height="2.5" rx="1.25" fill="url(#shimmer)"/>

<style>
  .h1 { font-family: "Helvetica Neue",Helvetica,Arial,sans-serif; font-size: 72px; font-weight: 800; fill: #f0f6fc; text-anchor: middle; dominant-baseline: middle; letter-spacing: -1.5px; }
  .h2 { font-family: "Helvetica Neue",Helvetica,Arial,sans-serif; font-size: 30px; font-weight: 400; fill: #38bdf8; text-anchor: middle; dominant-baseline: middle; letter-spacing: 1.5px; }
  .h3 { font-family: "Helvetica Neue",Helvetica,Arial,sans-serif; font-size: 20px; font-weight: 300; fill: #8b949e; text-anchor: middle; dominant-baseline: middle; letter-spacing: 3px; text-transform: uppercase; }

  /* 4 scenes @ 20s total — each scene 5s, smooth crossfade */
  @keyframes s0 { 0%{opacity:0;transform:translateY(14px)} 3%,20%{opacity:1;transform:translateY(0)} 24%,100%{opacity:0;transform:translateY(-10px)} }
  @keyframes s1 { 0%,24%{opacity:0;transform:translateY(14px)} 28%,45%{opacity:1;transform:translateY(0)} 49%,100%{opacity:0;transform:translateY(-10px)} }
  @keyframes s2 { 0%,49%{opacity:0;transform:translateY(14px)} 53%,70%{opacity:1;transform:translateY(0)} 74%,100%{opacity:0;transform:translateY(-10px)} }
  @keyframes s3 { 0%,74%{opacity:0;transform:translateY(14px)} 78%,95%{opacity:1;transform:translateY(0)} 99%,100%{opacity:0;transform:translateY(-10px)} }

  .sc0 { animation: s0 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  .sc1 { animation: s1 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  .sc2 { animation: s2 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  .sc3 { animation: s3 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
</style>

<!-- 0 — Intro -->
<g class="sc0">
  <text x="960" y="240" class="h1">Hey, I'm Hamdan 👋</text>
  <text x="960" y="345" class="h2">CS Student · Builder · AI Explorer</text>
  <text x="960" y="400" class="h3">Sharjah, UAE 🇦🇪</text>
</g>

<!-- 1 — AI -->
<g class="sc1">
  <text x="960" y="240" class="h1">I build AI that sees the world 👁️</text>
  <text x="960" y="345" class="h2">Computer Vision · Deep Learning · PyTorch</text>
  <text x="960" y="400" class="h3">From pixels to predictions</text>
</g>

<!-- 2 — Hardware -->
<g class="sc2">
  <text x="960" y="240" class="h1">I connect code to hardware ⚡</text>
  <text x="960" y="345" class="h2">IoT · Arduino · Raspberry Pi · Edge AI</text>
  <text x="960" y="400" class="h3">Bridging software and the physical world</text>
</g>

<!-- 3 — Closing -->
<g class="sc3">
  <text x="960" y="240" class="h1">Always building. Always learning. 🚀</text>
  <text x="960" y="345" class="h2">Open Source · Full Stack · Innovation</text>
  <text x="960" y="400" class="h3">Stay consistent · Stay curious</text>
</g>
</svg>