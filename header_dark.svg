<style>
  .h1 { font-family: "Helvetica Neue",Helvetica,Arial,sans-serif; font-size: 72px; font-weight: 800; fill: #f0f6fc; text-anchor: middle; dominant-baseline: middle; letter-spacing: -1.5px; }
  .h2 { font-family: "Helvetica Neue",Helvetica,Arial,sans-serif; font-size: 30px; font-weight: 400; fill: #38bdf8; text-anchor: middle; dominant-baseline: middle; letter-spacing: 1.5px; }
  .h3 { font-family: "Helvetica Neue",Helvetica,Arial,sans-serif; font-size: 20px; font-weight: 300; fill: #8b949e; text-anchor: middle; dominant-baseline: middle; letter-spacing: 3px; text-transform: uppercase; }

  /* 4 scenes @ 20s — ultra-smooth 240fps-grade transitions with many keyframe steps */
  @keyframes s0 {
    0%      { opacity: 0;    transform: translateY(10px); }
    1%      { opacity: 0.1;  transform: translateY(8px); }
    2%      { opacity: 0.3;  transform: translateY(5px); }
    3%      { opacity: 0.6;  transform: translateY(2px); }
    4%      { opacity: 0.85; transform: translateY(0.5px); }
    5%,20%  { opacity: 1;    transform: translateY(0); }
    21%     { opacity: 0.85; transform: translateY(-0.5px); }
    22%     { opacity: 0.6;  transform: translateY(-2px); }
    23%     { opacity: 0.3;  transform: translateY(-4px); }
    24%     { opacity: 0.1;  transform: translateY(-6px); }
    25%,100%{ opacity: 0;    transform: translateY(-8px); }
  }
  @keyframes s1 {
    0%,25%  { opacity: 0;    transform: translateY(10px); }
    26%     { opacity: 0.1;  transform: translateY(8px); }
    27%     { opacity: 0.3;  transform: translateY(5px); }
    28%     { opacity: 0.6;  transform: translateY(2px); }
    29%     { opacity: 0.85; transform: translateY(0.5px); }
    30%,45% { opacity: 1;    transform: translateY(0); }
    46%     { opacity: 0.85; transform: translateY(-0.5px); }
    47%     { opacity: 0.6;  transform: translateY(-2px); }
    48%     { opacity: 0.3;  transform: translateY(-4px); }
    49%     { opacity: 0.1;  transform: translateY(-6px); }
    50%,100%{ opacity: 0;    transform: translateY(-8px); }
  }
  @keyframes s2 {
    0%,50%  { opacity: 0;    transform: translateY(10px); }
    51%     { opacity: 0.1;  transform: translateY(8px); }
    52%     { opacity: 0.3;  transform: translateY(5px); }
    53%     { opacity: 0.6;  transform: translateY(2px); }
    54%     { opacity: 0.85; transform: translateY(0.5px); }
    55%,70% { opacity: 1;    transform: translateY(0); }
    71%     { opacity: 0.85; transform: translateY(-0.5px); }
    72%     { opacity: 0.6;  transform: translateY(-2px); }
    73%     { opacity: 0.3;  transform: translateY(-4px); }
    74%     { opacity: 0.1;  transform: translateY(-6px); }
    75%,100%{ opacity: 0;    transform: translateY(-8px); }
  }
  @keyframes s3 {
    0%,75%  { opacity: 0;    transform: translateY(10px); }
    76%     { opacity: 0.1;  transform: translateY(8px); }
    77%     { opacity: 0.3;  transform: translateY(5px); }
    78%     { opacity: 0.6;  transform: translateY(2px); }
    79%     { opacity: 0.85; transform: translateY(0.5px); }
    80%,95% { opacity: 1;    transform: translateY(0); }
    96%     { opacity: 0.85; transform: translateY(-0.5px); }
    97%     { opacity: 0.6;  transform: translateY(-2px); }
    98%     { opacity: 0.3;  transform: translateY(-4px); }
    99%     { opacity: 0.1;  transform: translateY(-6px); }
    100%    { opacity: 0;    transform: translateY(-8px); }
  }

  .sc0 { animation: s0 20s ease infinite; will-change: opacity, transform; }
  .sc1 { animation: s1 20s ease infinite; will-change: opacity, transform; }
  .sc2 { animation: s2 20s ease infinite; will-change: opacity, transform; }
  .sc3 { animation: s3 20s ease infinite; will-change: opacity, transform; }
</style>

<!-- 0 — Intro -->
<g class="sc0">
  <text x="960" y="240" class="h1">Hey, I'm Hamdan 👋</text>
  <text x="960" y="345" class="h2">CS Student · Builder · AI Explorer</text>
  <text x="960" y="400" class="h3">Sharjah, UAE 🇦🇪</text>
</g>

<!-- 1 — AI -->
<g class="sc1">
  <text x="960" y="240" class="h1">I build AI that sees the world 👁️</text>
  <text x="960" y="345" class="h2">Computer Vision · Deep Learning · PyTorch</text>
  <text x="960" y="400" class="h3">From pixels to predictions</text>
</g>

<!-- 2 — Hardware -->
<g class="sc2">
  <text x="960" y="240" class="h1">I connect code to hardware ⚡</text>
  <text x="960" y="345" class="h2">IoT · Arduino · Raspberry Pi · Edge AI</text>
  <text x="960" y="400" class="h3">Bridging software and the physical world</text>
</g>

<!-- 3 — Closing -->
<g class="sc3">
  <text x="960" y="240" class="h1">Always building. Always learning. 🚀</text>
  <text x="960" y="345" class="h2">Open Source · Full Stack · Innovation</text>
  <text x="960" y="400" class="h3">Stay consistent · Stay curious</text>
</g>
</svg>