  <line x1="864" y1="0" x2="864" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="960" y1="0" x2="960" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="1056" y1="0" x2="1056" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="1152" y1="0" x2="1152" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="1248" y1="0" x2="1248" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="1344" y1="0" x2="1344" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="1440" y1="0" x2="1440" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="1536" y1="0" x2="1536" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="1632" y1="0" x2="1632" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="1728" y1="0" x2="1728" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="1824" y1="0" x2="1824" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="1920" y1="0" x2="1920" y2="600" stroke="#000" stroke-width=".5"/>
  <line x1="0" y1="0" x2="1920" y2="0" stroke="#000" stroke-width=".5"/>
  <line x1="0" y1="96" x2="1920" y2="96" stroke="#000" stroke-width=".5"/>
  <line x1="0" y1="192" x2="1920" y2="192" stroke="#000" stroke-width=".5"/>
  <line x1="0" y1="288" x2="1920" y2="288" stroke="#000" stroke-width=".5"/>
  <line x1="0" y1="384" x2="1920" y2="384" stroke="#000" stroke-width=".5"/>
  <line x1="0" y1="480" x2="1920" y2="480" stroke="#000" stroke-width=".5"/>
  <line x1="0" y1="576" x2="1920" y2="576" stroke="#000" stroke-width=".5"/>
</g>

<circle cx="200" cy="150" r="2" fill="#0ea5e9" opacity="0.3">
  <animate attributeName="cy" values="150;130;150" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="500" cy="450" r="1.5" fill="#6366f1" opacity="0.25">
  <animate attributeName="cy" values="450;430;450" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.25;0.5;0.25" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="1400" cy="120" r="2.5" fill="#a855f7" opacity="0.25">
  <animate attributeName="cy" values="120;100;120" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.25;0.5;0.25" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="1700" cy="400" r="1.8" fill="#0ea5e9" opacity="0.3">
  <animate attributeName="cy" values="400;380;400" dur="4.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.5s" repeatCount="indefinite"/>
</circle>
<circle cx="960" cy="520" r="1.5" fill="#6366f1" opacity="0.2">
  <animate attributeName="cy" values="520;500;520" dur="5.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.2;0.45;0.2" dur="5.5s" repeatCount="indefinite"/>
</circle>
<circle cx="300" cy="380" r="1" fill="#a855f7" opacity="0.2">
  <animate attributeName="cy" values="380;365;380" dur="3.5s" repeatCount="indefinite"/>
</circle>
<circle cx="1600" cy="250" r="1.2" fill="#0ea5e9" opacity="0.15">
  <animate attributeName="cy" values="250;235;250" dur="4.2s" repeatCount="indefinite"/>
</circle>

<rect x="560" y="345" width="800" height="2" rx="1" fill="url(#accent)" opacity="0.4"/>
<rect x="560" y="345" width="800" height="2" rx="1" fill="url(#shimmer)"/>

<style>
  .title { font-family: "Helvetica Neue",Helvetica,Arial,sans-serif; font-size: 68px; font-weight: 800; fill: #1c2128; text-anchor: middle; dominant-baseline: middle; letter-spacing: -1px; }
  .subtitle { font-family: "Helvetica Neue",Helvetica,Arial,sans-serif; font-size: 32px; font-weight: 400; fill: #0969da; text-anchor: middle; dominant-baseline: middle; letter-spacing: 1px; }
  .tagline { font-family: "Helvetica Neue",Helvetica,Arial,sans-serif; font-size: 22px; font-weight: 300; fill: #656d76; text-anchor: middle; dominant-baseline: middle; letter-spacing: 2px; }
  @keyframes fadeSlide0 {
    0%,2%    { opacity:0; transform:translateY(15px); }
    6%,23%   { opacity:1; transform:translateY(0); }
    27%,100% { opacity:0; transform:translateY(-10px); }
  }
  @keyframes fadeSlide1 {
    0%,25%   { opacity:0; transform:translateY(15px); }
    29%,48%  { opacity:1; transform:translateY(0); }
    52%,100% { opacity:0; transform:translateY(-10px); }
  }
  @keyframes fadeSlide2 {
    0%,50%   { opacity:0; transform:translateY(15px); }
    54%,73%  { opacity:1; transform:translateY(0); }
    77%,100% { opacity:0; transform:translateY(-10px); }
  }
  @keyframes fadeSlide3 {
    0%,75%   { opacity:0; transform:translateY(15px); }
    79%,96%  { opacity:1; transform:translateY(0); }
    100%     { opacity:0; transform:translateY(-10px); }
  }
  .scene0 { animation: fadeSlide0 16s ease-in-out infinite; }
  .scene1 { animation: fadeSlide1 16s ease-in-out infinite; }
  .scene2 { animation: fadeSlide2 16s ease-in-out infinite; }
  .scene3 { animation: fadeSlide3 16s ease-in-out infinite; }
</style>

<g class="scene0">
  <text x="960" y="255" class="title">Hey, I'm Hamdan 👋</text>
  <text x="960" y="400" class="subtitle">CS Student · Builder · AI Explorer</text>
  <text x="960" y="460" class="tagline">SHARJAH, UAE 🇦🇪</text>
</g>
<g class="scene1">
  <text x="960" y="255" class="title">I build AI that sees the world 👁️</text>
  <text x="960" y="400" class="subtitle">Computer Vision · Deep Learning · PyTorch</text>
  <text x="960" y="460" class="tagline">FROM PIXELS TO PREDICTIONS</text>
</g>
<g class="scene2">
  <text x="960" y="255" class="title">I connect code to hardware ⚡</text>
  <text x="960" y="400" class="subtitle">IoT · Arduino · Raspberry Pi · Edge AI</text>
  <text x="960" y="460" class="tagline">BRIDGING SOFTWARE AND THE PHYSICAL WORLD</text>
</g>
<g class="scene3">
  <text x="960" y="255" class="title">Always building. Always learning. 🚀</text>
  <text x="960" y="400" class="subtitle">Open Source · Full Stack · Innovation</text>
  <text x="960" y="460" class="tagline">STAY CONSISTENT · STAY CURIOUS</text>
</g>
</svg>