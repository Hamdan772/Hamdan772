<svg width="1920" height="600" viewBox="0 0 1920 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="glow1" cx="30%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="70%" cy="60%" r="50%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0ea5e9"/>
    <stop offset="50%" stop-color="#6366f1"/>
    <stop offset="100%" stop-color="#a855f7"/>
  </linearGradient>
  <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0">
      <animate attributeName="offset" values="-1;2" dur="3s" repeatCount="indefinite"/>
    </stop>
    <stop offset="15%" stop-color="#0ea5e9" stop-opacity="0.5">
      <animate attributeName="offset" values="-0.85;2.15" dur="3s" repeatCount="indefinite"/>
    </stop>
    <stop offset="30%" stop-color="#0ea5e9" stop-opacity="0">
      <animate attributeName="offset" values="-0.7;2.3" dur="3s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
</defs>

<rect width="1920" height="600" fill="#f6f8fa" rx="16"/>
<rect width="1920" height="600" fill="url(#glow1)" rx="16"/>
<rect width="1920" height="600" fill="url(#glow2)" rx="16"/>

<g opacity="0.07">
  <line x1="0" y1="0" x2="0" y2="600" stroke="#000" stroke-width=".5"/>
